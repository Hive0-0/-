<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задания 1, 2 и 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Штучки</h1>
        <div class="task">
            <h2>Счетчик кликов</h2>
            <button id="clickButton">Нажми на меня</button>
            <p>Количество нажатий: <span id="clickCount">0</span></p>
            <p id="message"></p>
        </div>
        
        <hr>
        <div class="task">
            <h2>Таймер</h2>
            <p>Осталось времени: <span id="timer2">10</span></p>
            <button id="resetButton2">Сбросить</button>
        </div>
        
        <hr>
        <div class="task">
            <h2>Таймер 2</h2>
            <p>Таймер: <span id="timer3">0</span></p>
            <div class="button-group">
                <button id="startButton">Старт</button>
                <button id="stopButton">Стоп</button>
                <button id="resetButton3">Сброс</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
